<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booklly | Minha biblioteca</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topo">
    <div>
      <a class="logo" href="index.html" aria-label="Booklly - minha biblioteca"><img src="/logo.png" alt="Booklly"></a>
      <h1>Minha biblioteca</h1>
      <p class="subtitulo">Uma área para cada história.</p>
    </div>
    <div class="topo-acoes">
      <button id="botao-sair" class="botao botao-secundario" type="button">Sair</button>
      <a href="cadastrar.html" class="botao botao-primario">+ Novo Livro</a>
    </div>
  </header>

  <section id="painel" class="painel" aria-label="Resumo da biblioteca">
    <div class="painel-item">
      <span class="painel-numero" id="total-livros">–</span>
      <span class="painel-rotulo">Livros</span>
    </div>
    <div class="painel-item">
      <span class="painel-numero" id="total-lidos">–</span>
      <span class="painel-rotulo">Lidos</span>
    </div>
    <div class="painel-item">
      <span class="painel-numero" id="total-lendo">–</span>
      <span class="painel-rotulo">Lendo</span>
    </div>
    <div class="painel-item">
      <span class="painel-numero" id="media-notas">–</span>
      <span class="painel-rotulo">Nota média</span>
    </div>
  </section>

  <div class="barra-busca">
    <input type="search" id="busca" placeholder="Buscar por título ou autor..." aria-label="Buscar por título ou autor">
  </div>

  <nav class="filtros" aria-label="Filtrar por status">
    <button type="button" class="filtro ativo" data-status="" aria-pressed="true">Todos</button>
    <button type="button" class="filtro" data-status="quero_ler" aria-pressed="false">Quero Ler</button>
    <button type="button" class="filtro" data-status="lendo" aria-pressed="false">Lendo</button>
    <button type="button" class="filtro" data-status="lido" aria-pressed="false">Lidos</button>
  </nav>

  <main id="lista-livros" class="grid-livros"></main>

  <p id="mensagem-vazio" class="mensagem-vazio" hidden></p>

  <script src="script.js"></script>
</body>
</html>
