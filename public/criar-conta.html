<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booklly | Criar conta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-login">
  <main class="login-layout">
    <section class="login-introducao">
      <a class="logo" href="login.html" aria-label="Booklly - página inicial"><img src="/logo.png" alt="Booklly"></a>
      <h1>Um lugar para<br><em>suas histórias.</em></h1>
      <p>Crie sua conta e comece a montar uma biblioteca feita para o seu ritmo.</p>
    </section>
    <section class="login-painel" aria-labelledby="titulo-cadastro">
      <p class="etiqueta">Novo usuário</p>
      <h2 id="titulo-cadastro">Criar sua conta</h2>
      <p class="texto-suave">Preencha seus dados para começar </p>
      <form id="form-cadastro">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" autocomplete="name" required placeholder="Como podemos chamar você?">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="email" required placeholder="voce@exemplo.com">
        <label for="senha-cadastro">Senha</label>
        <input type="password" id="senha-cadastro" name="senha" autocomplete="new-password" minlength="6" required placeholder="Mínimo de 6 caracteres">
        <p id="mensagem-cadastro" class="mensagem-form" role="alert" hidden></p>
        <button class="botao botao-primario botao-login" type="submit">Criar minha conta <span aria-hidden="true">→</span></button>
      </form>
      <p class="link-cadastro">Já tem uma conta? <a href="login.html">Entrar</a></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
